spring.application.name=task-manager

# Define el prefijo global para toda la API REST
server.servlet.context-path=/api/v1

# Configuracion de conexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/task_manager_db
spring.datasource.username=user
spring.datasource.password=password

# Crear tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Swagger
## Ruta personalizada para acceder a la UI de Swagger
springdoc.swagger-ui.path=/api-docs/swagger-ui.html
## Ordenar los endpoints en la interfaz por su metodo HTTP (GET, POST, etc.)
springdoc.swagger-ui.operationsSorter=method
## Titulo y version general de la API
springdoc.api-docs.path=/api-docs
application.version=1.0.0
application.name=Task Manager API

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.exp-secret=${JWT_SECRET_EXPIRES}
security.jwt.refresh=${JWT_REFRESH}
security.jwt.exp-refresh=${JWT_REFRESH_EXPIRES}
