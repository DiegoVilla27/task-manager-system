<div
  class="min-h-screen flex items-center justify-center bg-slate-950 px-4 py-12 relative overflow-hidden"
>
  <!-- Background Glow & Grid Ornaments -->
  <div
    class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] h-[550px] bg-indigo-600/15 rounded-full blur-[130px] pointer-events-none"
  ></div>
  <div
    class="absolute bottom-10 right-10 w-[350px] h-[350px] bg-cyan-600/10 rounded-full blur-[100px] pointer-events-none"
  ></div>
  <div
    class="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] opacity-25 pointer-events-none"
  ></div>

  <!-- Login Card Container Orchestrator -->
  <div class="w-full max-w-md relative z-10">
    <app-login-brand />

    <app-login-form (submitted)="handleLoginSubmit($event)">
      <app-login-sso (ssoSelect)="handleSsoSelect($event)" />
    </app-login-form>

    <!-- Security & System Notice Footer -->
    <div class="mt-6 text-center">
      <p class="text-xs text-slate-500">
        Task Manager Backoffice v1.0.0 · © 2026 Todos los derechos reservados
      </p>
    </div>
  </div>
</div>
