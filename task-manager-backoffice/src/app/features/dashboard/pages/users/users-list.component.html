<div class="space-y-6">
  <!-- 1. Header & Actions -->
  <app-users-header
    (newUserClicked)="openCreateModal()"
    (exportCsvClicked)="exportCsv()"
  />

  <!-- 2. Stats Grid -->
  <app-users-stats [users]="users()" [totalRegistered]="24" />

  <!-- 3. Filters & Search Toolbar -->
  <app-users-filters
    [searchQuery]="searchQuery()"
    [roleFilter]="roleFilter()"
    [statusFilter]="statusFilter()"
    (searchChange)="handleSearchChange($event)"
    (roleChange)="handleRoleChange($event)"
    (statusChange)="handleStatusChange($event)"
    (clearFilters)="handleClearFilters()"
  />

  <!-- 4. Users Table & Pagination -->
  <app-users-table
    [users]="filteredUsers()"
    [totalUsers]="users().length"
    [currentPage]="currentPage()"
    [itemsPerPage]="pageSize()"
    (edit)="openEditModal($event)"
    (delete)="openDeleteModal($event)"
    (pageChange)="handlePageChange($event)"
  />

  <!-- 5. Create User Modal -->
  <app-user-create-modal
    [isOpen]="isCreateModalOpen()"
    (closed)="closeCreateModal()"
    (created)="handleCreateUser($event)"
  />

  <!-- 6. Edit User Modal -->
  <app-user-edit-modal
    [isOpen]="isEditModalOpen()"
    [user]="selectedUser()"
    (closed)="closeEditModal()"
    (saved)="handleSaveUser($event)"
  />

  <!-- 7. Delete User Modal -->
  <app-user-delete-modal
    [isOpen]="isDeleteModalOpen()"
    [user]="selectedUser()"
    (closed)="closeDeleteModal()"
    (confirmed)="handleDeleteUser($event)"
  />
</div>
