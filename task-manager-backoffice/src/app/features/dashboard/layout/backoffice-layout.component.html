<div
  class="h-screen w-screen overflow-hidden flex flex-col bg-slate-950 text-slate-100 selection:bg-indigo-500 selection:text-white"
>
  <!-- 1. Header / Topbar component -->
  <app-topbar
    [isSidebarCollapsed]="isSidebarCollapsed()"
    [isUserMenuOpen]="isUserMenuOpen()"
    (toggleSidebar)="toggleSidebar()"
    (toggleUserMenu)="toggleUserMenu()"
  />

  <!-- 2. Contenedor central: Sidebar + Router Outlet -->
  <div class="flex-1 min-h-0 flex overflow-hidden w-full">
    <app-sidebar [isCollapsed]="isSidebarCollapsed()" />

    <!-- MAIN: Área de contenido dinámico -->
    <main
      class="flex-1 min-w-0 h-full overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-950"
    >
      <div class="w-full max-w-7xl mx-auto">
        <router-outlet />
      </div>
    </main>
  </div>

  <!-- 3. Footer component -->
  <app-footer />
</div>
