name: CI Frontend (React)

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ci-frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. CHANGE DETECTION
  # ============================================================
  changes:
    name: 🔍 Check Frontend Changes
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Verify PR source branch
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "❌ ERROR: No está permitido hacer Pull Request a 'main' desde '$SOURCE_BRANCH'."
          echo "👉 Todo cambio hacia 'main' debe provenir obligatoriamente de 'dev'."
          exit 1

      - name: 🔍 Detect Frontend Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'task-manager-client/**'
              - '.github/workflows/ci-frontend.yml'

  # ============================================================
  # 2. FAST-FAIL STATIC QUALITY GATE
  # ============================================================
  static-checks:
    name: ⚡ Fast-Fail Quality Gate (Format, Lint & Types)

    needs: changes

    if: ${{ needs.changes.outputs.frontend == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task-manager-client

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./task-manager-client/pnpm-lock.yaml

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🎨 Prettier Format Check
        run: pnpm run format:check

      - name: ⚡ Run Oxlint
        run: pnpm run lint

      - name: 🛡️ Strict TypeScript Typecheck
        run: pnpm run typecheck

  # ============================================================
  # 3. UNIT TESTS
  # ============================================================
  unit-tests:
    name: 🧪 Unit Tests & Vitest Coverage

    needs:
      - changes
      - static-checks

    if: ${{ needs.changes.outputs.frontend == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task-manager-client

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./task-manager-client/pnpm-lock.yaml

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧪 Run Tests & Generate Coverage
        run: pnpm run test:unit

      - name: 📤 Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: task-manager-client/coverage/lcov.info
          retention-days: 1

  # ============================================================
  # 4. INTEGRATION TESTS
  # ============================================================
  integration-tests:
    name: 🔗 Integration Tests (MSW / Component)

    needs:
      - changes
      - static-checks

    if: ${{ needs.changes.outputs.frontend == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task-manager-client

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./task-manager-client/pnpm-lock.yaml

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🔗 Run Integration Tests
        run: |
          IT_FILES=$(find src \
            \( -name "*.integration.test.ts" -o -name "*.integration.test.tsx" \) \
            2>/dev/null || true)

          if [ -n "$IT_FILES" ]; then
            echo "🧪 Tests de integración encontrados:"
            echo "$IT_FILES"

            pnpm run test:integration
          else
            echo "ℹ️ No se encontraron tests de integración."
            echo "ℹ️ Omitiendo Integration Tests de forma segura."
          fi

  # ============================================================
  # 5. PRODUCTION BUILD
  # ============================================================
  build:
    name: 📦 Build Production Bundle (Vite)

    needs:
      - changes
      - static-checks

    if: ${{ needs.changes.outputs.frontend == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task-manager-client

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./task-manager-client/pnpm-lock.yaml

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦 Build Vite Bundle
        run: pnpm run build:prod

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: task-manager-client/dist
          retention-days: 1

  # ============================================================
  # 6. SONARCLOUD
  # ============================================================
  sonar:
    name: 🔍 SonarCloud Analysis & Quality Gate

    needs:
      - changes
      - unit-tests

    if: ${{ needs.changes.outputs.frontend == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download Coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: task-manager-client/coverage

      - name: 🔍 Run SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: task-manager-client
          args: >
            -Dsonar.projectKey=DiegoVilla27_task-manager-frontend
            -Dsonar.organization=diegovilla27
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
            -Dsonar.exclusions=src/main.ts
            -Dsonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts,src/setupTests.ts,src/**/*.test.{ts,tsx},src/**/*.d.ts,src/**/interfaces/**,src/**/types/**,src/**/models/**,src/**/schema/**,src/core/environments/**,src/**/*.integration.*,src/shared/mocks/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ============================================================
  # 7. E2E
  # ============================================================
  e2e:
    name: 📲 Full-Stack E2E (Cypress + Real API)

    needs:
      - changes
      - unit-tests
      - integration-tests
      - build

    if: ${{ needs.changes.outputs.frontend == 'true' }}

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Levantar Infraestructura Efímera (DB + API)
        run: |
          docker network create shared-network || true
          docker run -d --name global_postgres --network shared-network \
            -e POSTGRES_USER=user \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=task_manager_db \
            -p 5432:5432 postgres:15-alpine
          docker compose up -d --build spring-api

      - name: ⏳ Esperar disponibilidad de Spring Boot
        run: |
          timeout 60s bash -c '
            until curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/api-docs | grep -q "200"; do
              echo "Esperando a Spring Boot..."
              sleep 2
            done
          '
          echo "✅ Backend completamente operativo"

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: 📦 Install Frontend Dependencies
        run: pnpm --dir task-manager-client install

      - name: 🌲 Run Cypress E2E contra API Real
        uses: cypress-io/github-action@v6
        with:
          working-directory: task-manager-client
          install: false
          start: pnpm run local
          wait-on: "http://localhost:3000"
          wait-on-timeout: 60
          browser: chrome

      # Si algo falla: Capturas de pantalla de Cypress y logs de los contenedores
      - name: 📸 Upload Cypress artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: task-manager-client/cypress/screenshots

      - name: 📋 Dump Docker logs on failure
        if: failure()
        run: docker compose logs

  # ============================================================
  # 8. FINAL CI QUALITY GATE
  # ============================================================
  quality-gate:
    name: 🛡️ Frontend CI Quality Gate

    needs:
      - changes
      - static-checks
      - unit-tests
      - integration-tests
      - build
      - sonar
      - e2e

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Evaluate CI Results
        env:
          CHANGED: ${{ needs.changes.outputs.frontend }}
          CHANGES_RESULT: ${{ needs.changes.result }}

          STATIC_RESULT: ${{ needs.static-checks.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "=========================================="
          echo "🛡️ Frontend CI Quality Gate"
          echo "=========================================="

          echo "Changes:      $CHANGED"
          echo "Static:       $STATIC_RESULT"
          echo "Unit:         $UNIT_RESULT"
          echo "Integration:  $INTEGRATION_RESULT"
          echo "Build:        $BUILD_RESULT"
          echo "Sonar:        $SONAR_RESULT"
          echo "E2E:          $E2E_RESULT"
          echo "=========================================="

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "❌ Change detection / repository policy failed."
            exit 1
          fi

          if [[ "$CHANGED" != "true" ]]; then
            echo "ℹ️ No Frontend changes detected."
            echo "✅ Frontend CI Quality Gate PASSED."
            exit 0
          fi

          if [[ "$STATIC_RESULT" != "success" ]]; then
            echo "❌ Static checks failed."
            exit 1
          fi

          if [[ "$UNIT_RESULT" != "success" ]]; then
            echo "❌ Unit tests failed."
            exit 1
          fi

          if [[ "$INTEGRATION_RESULT" != "success" ]]; then
            echo "❌ Integration tests failed."
            exit 1
          fi

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "❌ Production build failed."
            exit 1
          fi

          if [[ "$SONAR_RESULT" != "success" ]]; then
            echo "❌ SonarCloud Quality Gate failed."
            exit 1
          fi

          if [[ "$E2E_RESULT" != "success" ]]; then
            echo "❌ E2E tests failed."
            exit 1
          fi

          echo "=========================================="
          echo "✅ FRONTEND CI QUALITY GATE PASSED"
          echo "=========================================="

  # ============================================================
  # 9. DISCORD NOTIFICATION REPORT
  # ============================================================
  notify:
    name: 📢 Discord CI/CD Summary
    needs:
      - changes
      - static-checks
      - unit-tests
      - integration-tests
      - build
      - sonar
      - e2e
      - quality-gate

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📢 Notify Discord (Single Consolidated Report)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODULE: "React Client"
          CHANGED: ${{ needs.changes.outputs.frontend }}
          STATIC_RESULT: ${{ needs.static-checks.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node ${{ github.workspace }}/.github/scripts/notify-discord-summary.js
