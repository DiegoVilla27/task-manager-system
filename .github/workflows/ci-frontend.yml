name: CI Frontend (React Client)

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'task-manager-client/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'task-manager-client/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  format:
    name: 🎨 Verify Code Formatting (Prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 🛑 Verify PR source branch is dev (when targeting main)
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "❌ ERROR: No está permitido hacer Pull Request a 'main' desde '$SOURCE_BRANCH'."
          echo "👉 Todo cambio hacia 'main' debe provenir obligatoriamente de la rama 'dev'."
          exit 1

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🎨 Prettier Check
        run: pnpm exec prettier --check "src/**/*.{ts,tsx,json,css,html}"

  lint:
    name: ⚡ Static Analysis (Oxlint)
    needs: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: ⚡ Run Oxlint
        run: pnpm run lint

  typecheck:
    name: 🛡️ Strict TypeScript Typecheck (tsc)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🛡️ Typecheck
        run: pnpm run typecheck

  test:
    name: 🧪 Vitest Test Suite & Coverage
    needs: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧪 Run Tests & Coverage
        run: pnpm run test:coverage

  sonar:
    name: 🔍 SonarCloud Code Analysis & Quality Gate
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧪 Run Vitest Coverage
        run: pnpm run test:coverage

      - name: 🔍 SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: task-manager-client
          args: >
            -Dsonar.projectKey=DiegoVilla27_task-manager-system
            -Dsonar.organization=diegovilla27
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  build:
    name: 📦 Build Production Bundle (Vite)
    needs: sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦 Build Vite Bundle
        run: pnpm exec vite build
