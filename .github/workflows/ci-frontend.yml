name: CI Frontend (React Client)

on:
  push:
    branches:
      - dev
    paths:
      - 'task-manager-client/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'task-manager-client/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  format:
    name: 🎨 Verify Code Formatting (Prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Prettier Check
        run: pnpm exec prettier --check "src/**/*.{ts,tsx,json,css,html}"

  lint:
    name: ⚡ Static Analysis (Oxlint)
    needs: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚡ Run Oxlint
        run: pnpm run lint

  typecheck:
    name: 🛡️ Strict TypeScript Typecheck (tsc)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛡️ Typecheck
        run: pnpm run typecheck

  test:
    name: 🧪 Vitest Test Suite & Coverage
    needs: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run Tests & Coverage
        run: pnpm run test:coverage

  build:
    name: 📦 Build Production Bundle (Vite)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-client
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-client/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Build Vite Bundle
        run: pnpm exec vite build
