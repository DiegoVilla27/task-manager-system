name: CI Backend (Spring Boot)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  format:
    name: 🎨 Verify Java Code Format (Spotless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 🛑 Verify PR source branch is dev (when targeting main)
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "❌ ERROR: No está permitido hacer Pull Request a 'main' desde '${{ github.head_ref }}'."
          echo "👉 Todo cambio hacia 'main' debe provenir obligatoriamente de la rama 'dev'."
          exit 1

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🎨 Spotless Format Check
        run: ./mvnw spotless:check

  compile:
    name: ⚙️ Compile Java Code
    needs: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: ⚙️ Maven Clean Compile
        run: ./mvnw clean compile

  test:
    name: 🧪 Unit Tests & JaCoCo Coverage
    needs: compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🧪 Run Tests & JaCoCo Report
        run: ./mvnw test jacoco:report -Dtest="!TaskManagerApplicationTests"

  build:
    name: 📦 Build Spring Boot JAR
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

  sonar:
    name: 🔍 SonarCloud Code Analysis & Quality Gate
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🧪 Run Tests & Generate JaCoCo Coverage
        run: ./mvnw test jacoco:report -Dtest="!TaskManagerApplicationTests"

      - name: 🔍 SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=DiegoVilla27_task-manager-system \
            -Dsonar.organization=diegovilla27 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
