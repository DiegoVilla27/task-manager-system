name: CI Backend (Spring Boot)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  changes:
    name: 🔍 Check Backend Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for backend changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'task-manager/**'
              - '.github/workflows/ci-backend.yml'

  static-checks:
    name: ⚡ Fast-Fail Quality Gate (Spotless & Compile)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 🛑 Verify PR source branch is dev (when targeting main)
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "❌ ERROR: No está permitido hacer Pull Request a 'main' desde '$SOURCE_BRANCH'."
          echo "👉 Todo cambio hacia 'main' debe provenir obligatoriamente de la rama 'dev'."
          exit 1

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🎨 Spotless Format Check
        run: ./mvnw spotless:check

      - name: ⚙️ Compile Java Code
        run: ./mvnw clean compile

  unit-tests:
    name: 🧪 Unit Tests & JaCoCo Coverage
    needs: [changes, static-checks]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🧪 Run Tests & JaCoCo Report
        run: ./mvnw test jacoco:report -Dtest="!TaskManagerApplicationTests,!*IntegrationTest,!*IT"

      - name: 📤 Upload JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: task-manager/target/site/jacoco/jacoco.xml
          retention-days: 1

  integration-tests:
    name: 🔗 Integration Tests (Testcontainers / Spring)
    needs: [changes, static-checks]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🔗 Run Integration Tests (Optional / If exist)
        run: |
          IT_FILES=$(find src/test/java -name "*IntegrationTest.java" -o -name "*IT.java" 2>/dev/null || true)
          if [ -n "$IT_FILES" ]; then
            echo "🧪 Tests de integración encontrados:"
            echo "$IT_FILES"
            ./mvnw test -Dtest="*IntegrationTest,*IT" -Dsurefire.failIfNoSpecifiedTests=false
          else
            echo "ℹ️ No se encontraron archivos de integración (*IntegrationTest.java, *IT.java). Omitiendo de forma segura."
          fi

  build:
    name: 📦 Build Spring Boot JAR
    needs: [changes, static-checks]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 📦 Build JAR Package
        run: ./mvnw package -DskipTests

  sonar:
    name: 🔍 SonarCloud Code Analysis & Quality Gate
    needs: [changes, unit-tests]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 📥 Download JaCoCo Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco
          path: task-manager/target/site/jacoco

      - name: 🔍 SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=DiegoVilla27_task-manager-system \
            -Dsonar.organization=diegovilla27 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
