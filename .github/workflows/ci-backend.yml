name: CI Backend (Spring Boot)

on:
  push:
    branches:
      - dev
    paths:
      - 'task-manager/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'task-manager/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  build-and-test:
    name: Backend Lint, Test & Coverage (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🎨 Verify Java Code Format (Spotless)
        run: ./mvnw spotless:check

      - name: 🧪 Run Unit & Domain Tests with JaCoCo Coverage
        run: ./mvnw clean test jacoco:report -Dtest="!TaskManagerApplicationTests"

      - name: 📦 Build Spring Boot Application (JAR)
        run: ./mvnw package -DskipTests
