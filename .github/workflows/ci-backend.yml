name: CI Backend (Spring Boot)

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ci-backend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. CHANGE DETECTION
  # ============================================================
  changes:
    name: 🔍 Check Backend Changes
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Verify PR source branch
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "❌ ERROR: No está permitido hacer Pull Request a 'main' desde '$SOURCE_BRANCH'."
          echo "👉 Todo cambio hacia 'main' debe provenir obligatoriamente de 'dev'."
          exit 1

      - name: 🔍 Detect Backend Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'task-manager/**'
              - '.github/workflows/ci-backend.yml'

  # ============================================================
  # 2. FAST-FAIL STATIC QUALITY GATE
  # ============================================================
  static-checks:
    name: ⚡ Fast-Fail Quality Gate (Format & Compile)

    needs: changes

    if: ${{ needs.changes.outputs.backend == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task-manager

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🎨 Spotless Format Check
        run: ./mvnw spotless:check

      - name: ⚙️ Compile Java Code
        run: ./mvnw clean compile

      - name: 📢 Notify Discord (Static Checks & Compile)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993; STATUS_TXT="PASSED"; EMOJI="✅"
          elif [ "$JOB_STATUS" = "failure" ]; then
            COLOR=15158332; STATUS_TXT="FAILED"; EMOJI="❌"
          else
            COLOR=15965458; STATUS_TXT="CANCELLED"; EMOJI="⚠️"
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "${{ github.event.head_commit.message }}" | head -n 1 | sed 's/"/\\"/g' | cut -c1-100)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(cat <<JSON
          {
            "username": "GitHub Actions CI",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "$EMOJI [Backend Spring] Spotless & Compile: $STATUS_TXT",
              "color": $COLOR,
              "description": "**Commit:** \`$COMMIT_MSG\`",
              "fields": [
                { "name": "🌿 Rama", "value": "\`${{ github.ref_name }}\`", "inline": true },
                { "name": "👤 Autor", "value": "\`${{ github.actor }}\`", "inline": true },
                { "name": "🔍 Logs", "value": "[Ver Ejecución]($RUN_URL)", "inline": true }
              ],
              "footer": { "text": "Task Manager • Spring Boot API CI" },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
JSON
          )
          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" || true

  # ============================================================
  # 3. UNIT TESTS
  # ============================================================
  unit-tests:
    name: 🧪 Unit Tests & JaCoCo Coverage

    needs:
      - changes
      - static-checks

    if: ${{ needs.changes.outputs.backend == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task-manager

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🧪 Run Unit Tests & Generate JaCoCo Report
        run: |
          ./mvnw test jacoco:report \
            -Dtest="!TaskManagerApplicationTests,!*IntegrationTest,!*IT"

      - name: 📤 Upload JaCoCo Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: task-manager/target/site/jacoco/jacoco.xml
          retention-days: 1

      - name: 📢 Notify Discord (Unit Tests)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993; STATUS_TXT="PASSED"; EMOJI="✅"
          elif [ "$JOB_STATUS" = "failure" ]; then
            COLOR=15158332; STATUS_TXT="FAILED"; EMOJI="❌"
          else
            COLOR=15965458; STATUS_TXT="CANCELLED"; EMOJI="⚠️"
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "${{ github.event.head_commit.message }}" | head -n 1 | sed 's/"/\\"/g' | cut -c1-100)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(cat <<JSON
          {
            "username": "GitHub Actions CI",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "$EMOJI [Backend Spring] Unit Tests & JaCoCo: $STATUS_TXT",
              "color": $COLOR,
              "description": "**Commit:** \`$COMMIT_MSG\`",
              "fields": [
                { "name": "🌿 Rama", "value": "\`${{ github.ref_name }}\`", "inline": true },
                { "name": "👤 Autor", "value": "\`${{ github.actor }}\`", "inline": true },
                { "name": "🔍 Logs", "value": "[Ver Ejecución]($RUN_URL)", "inline": true }
              ],
              "footer": { "text": "Task Manager • Spring Boot API CI" },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
JSON
          )
          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" || true

  # ============================================================
  # 4. INTEGRATION TESTS
  # ============================================================
  integration-tests:
    name: 🔗 Integration Tests (Testcontainers / Spring)

    needs:
      - changes
      - static-checks

    if: ${{ needs.changes.outputs.backend == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task-manager

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🔗 Run Integration Tests
        run: |
          IT_FILES=$(find src/test/java \
            \( -name "*IntegrationTest.java" -o -name "*IT.java" \) \
            2>/dev/null || true)

          if [ -n "$IT_FILES" ]; then
            echo "🧪 Tests de integración encontrados:"
            echo "$IT_FILES"

            ./mvnw test \
              -Dtest="*IntegrationTest,*IT" \
              -Dsurefire.failIfNoSpecifiedTests=false
          else
            echo "ℹ️ No se encontraron tests de integración."
            echo "ℹ️ Omitiendo Integration Tests de forma segura."
          fi

      - name: 📢 Notify Discord (Integration Tests)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993; STATUS_TXT="PASSED"; EMOJI="✅"
          elif [ "$JOB_STATUS" = "failure" ]; then
            COLOR=15158332; STATUS_TXT="FAILED"; EMOJI="❌"
          else
            COLOR=15965458; STATUS_TXT="CANCELLED"; EMOJI="⚠️"
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "${{ github.event.head_commit.message }}" | head -n 1 | sed 's/"/\\"/g' | cut -c1-100)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(cat <<JSON
          {
            "username": "GitHub Actions CI",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "$EMOJI [Backend Spring] Integration Tests: $STATUS_TXT",
              "color": $COLOR,
              "description": "**Commit:** \`$COMMIT_MSG\`",
              "fields": [
                { "name": "🌿 Rama", "value": "\`${{ github.ref_name }}\`", "inline": true },
                { "name": "👤 Autor", "value": "\`${{ github.actor }}\`", "inline": true },
                { "name": "🔍 Logs", "value": "[Ver Ejecución]($RUN_URL)", "inline": true }
              ],
              "footer": { "text": "Task Manager • Spring Boot API CI" },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
JSON
          )
          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" || true

  # ============================================================
  # 5. PRODUCTION BUILD
  # ============================================================
  build:
    name: 📦 Build Spring Boot JAR

    needs:
      - changes
      - static-checks

    if: ${{ needs.changes.outputs.backend == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task-manager

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 📦 Build Production JAR
        run: ./mvnw package -DskipTests

      - name: 📤 Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: task-manager/target/*.jar
          retention-days: 1

      - name: 📢 Notify Discord (Build)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993; STATUS_TXT="PASSED"; EMOJI="✅"
          elif [ "$JOB_STATUS" = "failure" ]; then
            COLOR=15158332; STATUS_TXT="FAILED"; EMOJI="❌"
          else
            COLOR=15965458; STATUS_TXT="CANCELLED"; EMOJI="⚠️"
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "${{ github.event.head_commit.message }}" | head -n 1 | sed 's/"/\\"/g' | cut -c1-100)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(cat <<JSON
          {
            "username": "GitHub Actions CI",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "$EMOJI [Backend Spring] Production JAR Build: $STATUS_TXT",
              "color": $COLOR,
              "description": "**Commit:** \`$COMMIT_MSG\`",
              "fields": [
                { "name": "🌿 Rama", "value": "\`${{ github.ref_name }}\`", "inline": true },
                { "name": "👤 Autor", "value": "\`${{ github.actor }}\`", "inline": true },
                { "name": "🔍 Logs", "value": "[Ver Ejecución]($RUN_URL)", "inline": true }
              ],
              "footer": { "text": "Task Manager • Spring Boot API CI" },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
JSON
          )
          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" || true

  # ============================================================
  # 6. SONARCLOUD
  # ============================================================
  sonar:
    name: 🔍 SonarCloud Analysis & Quality Gate

    needs:
      - changes
      - unit-tests

    if: ${{ needs.changes.outputs.backend == 'true' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task-manager

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 📥 Download JaCoCo Coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-jacoco
          path: task-manager/target/site/jacoco

      - name: 🔍 Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=DiegoVilla27_task-manager-backend \
            -Dsonar.organization=diegovilla27 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: 📢 Notify Discord (SonarCloud)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993; STATUS_TXT="PASSED"; EMOJI="✅"
          elif [ "$JOB_STATUS" = "failure" ]; then
            COLOR=15158332; STATUS_TXT="FAILED"; EMOJI="❌"
          else
            COLOR=15965458; STATUS_TXT="CANCELLED"; EMOJI="⚠️"
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "${{ github.event.head_commit.message }}" | head -n 1 | sed 's/"/\\"/g' | cut -c1-100)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(cat <<JSON
          {
            "username": "GitHub Actions CI",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "$EMOJI [Backend Spring] SonarCloud Quality Gate: $STATUS_TXT",
              "color": $COLOR,
              "description": "**Commit:** \`$COMMIT_MSG\`",
              "fields": [
                { "name": "🌿 Rama", "value": "\`${{ github.ref_name }}\`", "inline": true },
                { "name": "👤 Autor", "value": "\`${{ github.actor }}\`", "inline": true },
                { "name": "🔍 Logs", "value": "[Ver Ejecución]($RUN_URL)", "inline": true }
              ],
              "footer": { "text": "Task Manager • Spring Boot API CI" },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
JSON
          )
          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" || true

  # ============================================================
  # 7. FINAL CI QUALITY GATE
  # ============================================================
  quality-gate:
    name: 🛡️ Backend CI Quality Gate

    needs:
      - changes
      - static-checks
      - unit-tests
      - integration-tests
      - build
      - sonar

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: 🛡️ Evaluate CI Results
        env:
          CHANGED: ${{ needs.changes.outputs.backend }}
          CHANGES_RESULT: ${{ needs.changes.result }}

          STATIC_RESULT: ${{ needs.static-checks.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          echo "=========================================="
          echo "🛡️ Backend CI Quality Gate"
          echo "=========================================="

          echo "Changes:      $CHANGED"
          echo "Static:       $STATIC_RESULT"
          echo "Unit:         $UNIT_RESULT"
          echo "Integration:  $INTEGRATION_RESULT"
          echo "Build:        $BUILD_RESULT"
          echo "Sonar:        $SONAR_RESULT"
          echo "=========================================="

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "❌ Change detection / repository policy failed."
            exit 1
          fi

          if [[ "$CHANGED" != "true" ]]; then
            echo "ℹ️ No Backend changes detected."
            echo "✅ Backend CI Quality Gate PASSED."
            exit 0
          fi

          if [[ "$STATIC_RESULT" != "success" ]]; then
            echo "❌ Static checks failed."
            exit 1
          fi

          if [[ "$UNIT_RESULT" != "success" ]]; then
            echo "❌ Unit tests failed."
            exit 1
          fi

          if [[ "$INTEGRATION_RESULT" != "success" ]]; then
            echo "❌ Integration tests failed."
            exit 1
          fi

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "❌ Production build failed."
            exit 1
          fi

          if [[ "$SONAR_RESULT" != "success" ]]; then
            echo "❌ SonarCloud Quality Gate failed."
            exit 1
          fi

          echo "=========================================="
          echo "✅ BACKEND CI QUALITY GATE PASSED"
          echo "=========================================="

      - name: 📢 Notify Discord (Final Quality Gate Report)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CHANGED: ${{ needs.changes.outputs.backend }}
          STATIC_RESULT: ${{ needs.static-checks.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi

          if [[ "$CHANGED" != "true" ]]; then
            COLOR=3447003
            TITLE="ℹ️ [Spring API] CI Omitido (Sin cambios)"
          elif [[ "$STATIC_RESULT" == "success" && "$UNIT_RESULT" == "success" && "$INTEGRATION_RESULT" == "success" && "$BUILD_RESULT" == "success" && "$SONAR_RESULT" == "success" ]]; then
            COLOR=3066993
            TITLE="🎉 [Spring API] Quality Gate PASSED - Todo Exitoso"
          else
            COLOR=15158332
            TITLE="🚨 [Spring API] Quality Gate FAILED - Pipeline con Errores"
          fi

          icon() {
            case "$1" in
              "success") echo "✅ Exitoso" ;;
              "failure") echo "❌ Fallido" ;;
              "skipped") echo "⏭️ Omitido" ;;
              "cancelled") echo "⚠️ Cancelado" ;;
              *) echo "❓ Desconocido" ;;
            esac
          }

          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "${{ github.event.head_commit.message }}" | head -n 1 | sed 's/"/\\"/g' | cut -c1-100)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(cat <<JSON
          {
            "username": "GitHub Actions CI",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": "$TITLE",
              "color": $COLOR,
              "description": "**Commit:** \`$COMMIT_MSG\`\n**Rama:** \`${{ github.ref_name }}\` • **Autor:** \`${{ github.actor }}\`\n[🔗 Ver detalles en GitHub Actions]($RUN_URL)",
              "fields": [
                { "name": "🎨 Spotless & Compilación", "value": "$(icon $STATIC_RESULT)", "inline": true },
                { "name": "🧪 Pruebas Unitarias", "value": "$(icon $UNIT_RESULT)", "inline": true },
                { "name": "🔗 Pruebas Integración", "value": "$(icon $INTEGRATION_RESULT)", "inline": true },
                { "name": "📦 Build de JAR", "value": "$(icon $BUILD_RESULT)", "inline": true },
                { "name": "🔍 SonarCloud Gate", "value": "$(icon $SONAR_RESULT)", "inline": true }
              ],
              "footer": { "text": "Task Manager • Reporte Final de CI" },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
JSON
          )
          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" || true
