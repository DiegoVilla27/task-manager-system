name: CI Backend (Spring Boot)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  changes:
    name: 🔍 Check Backend Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for backend changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'task-manager/**'
              - '.github/workflows/ci-backend.yml'

  format:
    name: 🎨 Verify Java Code Format (Spotless)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 🛑 Verify PR source branch is dev (when targeting main)
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "❌ ERROR: No está permitido hacer Pull Request a 'main' desde '$SOURCE_BRANCH'."
          echo "👉 Todo cambio hacia 'main' debe provenir obligatoriamente de la rama 'dev'."
          exit 1

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🎨 Spotless Format Check
        run: ./mvnw spotless:check

  compile:
    name: ⚙️ Compile Java Code
    needs: [changes, format]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: ⚙️ Maven Clean Compile
        run: ./mvnw clean compile

  unit-tests:
    name: 🧪 Unit Tests & JaCoCo Coverage
    needs: [changes, compile]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🧪 Run Tests & JaCoCo Report
        run: ./mvnw test jacoco:report -Dtest="!TaskManagerApplicationTests,!*IntegrationTest,!*IT"

  integration-tests:
    name: 🔗 Integration Tests (Testcontainers / Spring)
    needs: [changes, compile]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🔗 Run Integration Tests (if any)
        run: ./mvnw test -Dtest="*IntegrationTest,*IT" -Dsurefire.failIfNoSpecifiedTests=false

  sonar:
    name: 🔍 SonarCloud Code Analysis & Quality Gate
    needs: [changes, unit-tests, integration-tests]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🧪 Run Tests & Generate JaCoCo Coverage
        run: ./mvnw test jacoco:report -Dtest="!TaskManagerApplicationTests,!*IntegrationTest,!*IT"

      - name: 🔍 SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=DiegoVilla27_task-manager-system \
            -Dsonar.organization=diegovilla27 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  build:
    name: 📦 Build Spring Boot JAR
    needs: [changes, sonar]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 📦 Build JAR Package
        run: ./mvnw package -DskipTests
