name: CI Backend (Spring Boot)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  format:
    name: 🎨 Verify Java Code Format (Spotless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🎨 Spotless Format Check
        run: ./mvnw spotless:check

  compile:
    name: ⚙️ Compile Java Code
    needs: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: ⚙️ Maven Clean Compile
        run: ./mvnw clean compile

  test:
    name: 🧪 Unit Tests & JaCoCo Coverage
    needs: compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🧪 Run Tests & JaCoCo Report
        run: ./mvnw test jacoco:report -Dtest="!TaskManagerApplicationTests"

  build:
    name: 📦 Build Spring Boot JAR
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 📦 Build JAR Package
        run: ./mvnw package -DskipTests
