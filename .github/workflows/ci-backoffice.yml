name: CI Backoffice (Angular)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  changes:
    name: 🔍 Check Backoffice Changes
    runs-on: ubuntu-latest
    outputs:
      backoffice: ${{ steps.filter.outputs.backoffice }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for backoffice changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backoffice:
              - 'task-manager-backoffice/**'
              - '.github/workflows/ci-backoffice.yml'

  static-checks:
    name: ⚡ Fast-Fail Quality Gate (Format, Lint & Types)
    needs: changes
    if: ${{ needs.changes.outputs.backoffice == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-backoffice
    steps:
      - name: 🛑 Verify PR source branch is dev (when targeting main)
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "❌ ERROR: No está permitido hacer Pull Request a 'main' desde '$SOURCE_BRANCH'."
          echo "👉 Todo cambio hacia 'main' debe provenir obligatoriamente de la rama 'dev'."
          exit 1

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-backoffice/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🎨 Prettier Format Check
        run: pnpm run format:check

      - name: ⚡ Run ESLint
        run: pnpm run lint

      - name: 🛡️ Strict TypeScript Typecheck
        run: pnpm run typecheck

  unit-tests:
    name: 🧪 Unit Tests & Karma Coverage
    needs: [changes, static-checks]
    if: ${{ needs.changes.outputs.backoffice == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-backoffice
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-backoffice/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧪 Run Tests & Generate Coverage
        run: pnpm run test:coverage

      - name: 📤 Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backoffice-coverage
          path: task-manager-backoffice/coverage/lcov.info
          retention-days: 1

  integration-tests:
    name: 🔗 Integration Tests (Component / Router)
    needs: [changes, static-checks]
    if: ${{ needs.changes.outputs.backoffice == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-backoffice
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-backoffice/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🔗 Run Integration Tests (Optional / If exist)
        run: |
          IT_FILES=$(find src -name "*.integration.spec.ts" 2>/dev/null || true)
          if [ -n "$IT_FILES" ]; then
            echo "🧪 Tests de integración encontrados:"
            echo "$IT_FILES"
            pnpm run test:integration
          else
            echo "ℹ️ No se encontraron archivos de integración (*.integration.spec.ts). Omitiendo de forma segura."
          fi

  build:
    name: 📦 Build Production Bundle (Angular)
    needs: [changes, static-checks]
    if: ${{ needs.changes.outputs.backoffice == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-backoffice
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './task-manager-backoffice/pnpm-lock.yaml'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦 Build Angular Bundle
        run: pnpm run build

  sonar:
    name: 🔍 SonarCloud Code Analysis & Quality Gate
    needs: [changes, unit-tests]
    if: ${{ needs.changes.outputs.backoffice == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager-backoffice
    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: backoffice-coverage
          path: task-manager-backoffice/coverage

      - name: 🔍 SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: task-manager-backoffice
          args: >
            -Dsonar.projectKey=DiegoVilla27_task-manager-system
            -Dsonar.organization=diegovilla27
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.spec.ts
            -Dsonar.exclusions=src/main.ts
            -Dsonar.coverage.exclusions=src/main.ts,src/**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
